<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="favBgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0a1d42"/>
      <stop offset="65%" stop-color="#060b18"/>
      <stop offset="100%" stop-color="#040711"/>
    </radialGradient>

    <!-- Upper triangle: Left facet -->
    <linearGradient id="favFacetLeft" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#60c5ff"/>
      <stop offset="45%" stop-color="#0091ff"/>
      <stop offset="100%" stop-color="#0062d6"/>
    </linearGradient>

    <!-- Upper triangle: Right facet -->
    <linearGradient id="favFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006edc"/>
      <stop offset="60%" stop-color="#003e9e"/>
      <stop offset="100%" stop-color="#072054"/>
    </linearGradient>

    <!-- Lower chevron: Left wing -->
    <linearGradient id="favChevLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff"/>
      <stop offset="60%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0055cb"/>
    </linearGradient>

    <!-- Lower chevron: Right wing -->
    <linearGradient id="favChevRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005ec4"/>
      <stop offset="70%" stop-color="#002b80"/>
      <stop offset="100%" stop-color="#06163b"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="14" fill="url(#favBgGlow)"/>

  <!-- Centered Official 3D Delta Mark -->
  <g transform="translate(14, 11) scale(0.9)">
    <!-- 1. Upper Triangle -->
    <path d="M 20 2 L 2 32 L 20 26 Z" fill="url(#favFacetLeft)"/>
    <path d="M 20 2 L 20 26 L 38 32 Z" fill="url(#favFacetRight)"/>
    <line x1="20" y1="2" x2="20" y2="26" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.5"/>

    <!-- 2. Lower Chevron -->
    <path d="M 20 30 L 0 41 L 3 43 L 20 35 Z" fill="url(#favChevLeft)"/>
    <path d="M 20 30 L 20 35 L 37 43 L 40 41 Z" fill="url(#favChevRight)"/>
  </g>
</svg>
