<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" width="250" height="56" fill="none">
  <defs>
    <!-- Upper triangle: Left facet -->
    <linearGradient id="headerFacetLeft" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Upper triangle: Right facet -->
    <linearGradient id="headerFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f2b6e"/>
    </linearGradient>

    <!-- Lower chevron: Left wing -->
    <linearGradient id="headerChevLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Lower chevron: Right wing -->
    <linearGradient id="headerChevRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="70%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a1942"/>
    </linearGradient>

    <linearGradient id="growwGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Official 3D Arrowhead Emblem (Scaled & Centered) -->
  <g transform="translate(4, 5) scale(0.9)">
    <!-- 1. Upper Triangle -->
    <path d="M 26 2 L 6 36 L 26 29 Z" fill="url(#headerFacetLeft)"/>
    <path d="M 26 2 L 26 29 L 46 36 Z" fill="url(#headerFacetRight)"/>
    <line x1="26" y1="2" x2="26" y2="29" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.5"/>

    <!-- 2. Lower Chevron -->
    <path d="M 26 33 L 2 45 L 6 47 L 26 38 Z" fill="url(#headerChevLeft)"/>
    <path d="M 26 33 L 26 38 L 46 47 L 50 45 Z" fill="url(#headerChevRight)"/>
  </g>

  <!-- Brand Typography Lockup -->
  <!-- "TECH" in Bold Primary Dark Navy -->
  <text x="64" y="32" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="0.5" 
        fill="#0B132B">TECH</text>

  <!-- "GROWW" in Bold Accent Blue -->
  <text x="135" y="32" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="0.5" 
        fill="url(#growwGrad)">GROWW</text>

  <!-- Subtitle Tagline Under Text -->
  <text x="65" y="44" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="8.5" 
        font-weight="700" 
        letter-spacing="3.8" 
        fill="#64748B">IT SOLUTIONS</text>
</svg>
