    <path d="M22 17V33" stroke="url(#tgNodeGrad)" stroke-width="3" stroke-linecap="round"/>
    <!-- Tech Node Core -->
    <circle cx="22" cy="17" r="4" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>
    <circle cx="14" cy="28" r="2.5" fill="#38BDF8"/>
    <circle cx="30" cy="28" r="2.5" fill="#7C3AED"/>
