  <!-- Typography: Techgroww -->
  <text x="62" y="34" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" fill="#0B132B">Tech<tspan fill="url(#tgLogoGrad)">groww</tspan></text>
  <circle cx="218" cy="30" r="3.5" fill="#2563EB"/>
