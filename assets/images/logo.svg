<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50" fill="none">
  <defs>
    <!-- Upper triangle: Left facet -->
    <linearGradient id="headerFacetLeft" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Upper triangle: Right facet -->
    <linearGradient id="headerFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f2b6e"/>
    </linearGradient>

    <!-- Lower chevron: Left wing -->
    <linearGradient id="headerChevLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Lower chevron: Right wing -->
    <linearGradient id="headerChevRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="70%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0a1942"/>
    </linearGradient>

    <!-- Wordmark gradient for GROWW -->
    <linearGradient id="growwTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Official 3D Arrowhead Emblem -->
  <g transform="translate(2, 2) scale(0.95)">
    <!-- 1. Upper Triangle -->
    <path d="M 24 3 L 5 35 L 24 28 Z" fill="url(#headerFacetLeft)"/>
    <path d="M 24 3 L 24 28 L 43 35 Z" fill="url(#headerFacetRight)"/>
    <line x1="24" y1="3" x2="24" y2="28" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.6"/>

    <!-- 2. Lower Chevron Wings -->
    <path d="M 24 32 L 2 43 L 5 45 L 24 37 Z" fill="url(#headerChevLeft)"/>
    <path d="M 24 32 L 24 37 L 43 45 L 46 43 Z" fill="url(#headerChevRight)"/>
  </g>

  <!-- Official Brand Wordmark: TECH GROWW -->
  <text x="56" y="34" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="26" 
        font-weight="800" 
        letter-spacing="0.5" 
        fill="#0B132B">TECH</text>

  <text x="131" y="34" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="26" 
        font-weight="800" 
        letter-spacing="0.5" 
        fill="url(#growwTextGrad)">GROWW</text>
</svg>
