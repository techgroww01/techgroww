<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" width="250" height="56" fill="none">
  <defs>
    <!-- Upper triangle: Left facet -->
    <linearGradient id="whiteFacetLeft" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#60c5ff"/>
      <stop offset="45%" stop-color="#0091ff"/>
      <stop offset="100%" stop-color="#0062d6"/>
    </linearGradient>

    <!-- Upper triangle: Right facet -->
    <linearGradient id="whiteFacetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006edc"/>
      <stop offset="60%" stop-color="#003e9e"/>
      <stop offset="100%" stop-color="#072054"/>
    </linearGradient>

    <!-- Lower chevron: Left wing -->
    <linearGradient id="whiteChevLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d8ff"/>
      <stop offset="60%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0055cb"/>
    </linearGradient>

    <!-- Lower chevron: Right wing -->
    <linearGradient id="whiteChevRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005ec4"/>
      <stop offset="70%" stop-color="#002b80"/>
      <stop offset="100%" stop-color="#06163b"/>
    </linearGradient>

    <linearGradient id="whiteGrowwGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Official 3D Arrowhead Emblem (Scaled & Centered) -->
  <g transform="translate(4, 5) scale(0.9)">
    <!-- 1. Upper Triangle -->
    <path d="M 26 2 L 6 36 L 26 29 Z" fill="url(#whiteFacetLeft)"/>
    <path d="M 26 2 L 26 29 L 46 36 Z" fill="url(#whiteFacetRight)"/>
    <line x1="26" y1="2" x2="26" y2="29" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6"/>

    <!-- 2. Lower Chevron -->
    <path d="M 26 33 L 2 45 L 6 47 L 26 38 Z" fill="url(#whiteChevLeft)"/>
    <path d="M 26 33 L 26 38 L 46 47 L 50 45 Z" fill="url(#whiteChevRight)"/>
  </g>

  <!-- Brand Typography Lockup for Dark Surfaces -->
  <!-- "TECH" in Crisp Pure White -->
  <text x="64" y="32" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="0.5" 
        fill="#FFFFFF">TECH</text>

  <!-- "GROWW" in Luminous Gradient Cyan/Blue -->
  <text x="135" y="32" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="24" 
        font-weight="800" 
        letter-spacing="0.5" 
        fill="url(#whiteGrowwGrad)">GROWW</text>

  <!-- Subtitle Tagline Under Text -->
  <text x="65" y="44" 
        font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="8.5" 
        font-weight="700" 
        letter-spacing="3.8" 
        fill="#94A3B8">IT SOLUTIONS</text>
</svg>
